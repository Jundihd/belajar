<!DOCTYPE html>
<html>
<head>
    <title>Profile Diri</title>
</head>
<body>

    <!-- Div: digunakan untuk mengelompokkan judul halaman -->
    <div>
        <h1>Profil Saya</h1>
        <p>Halo! Saya Jundi</p>
    </div>

    <!-- Img: untuk menampilkan foto profil -->
    <h3>Foto Profil</h3>
    <img width="200" height="200" src="Screenshot 2025-09-28 232847.png" alt="Foto Profil Saya">

    <!-- Video: menyematkan video perkenalan -->
    <h3>Video Perkenalan</h3>
    <video width="320" height="240" controls>
        <source src="sample-video.mp4" type="video/mp4">
        Browser anda tidak mendukung video.
    </video>
    
    <!-- Table: digunakan untuk menampilkan data diri dalam bentuk tabel -->
    <h2>Informasi Pribadi</h2>
    <table border="1">
        <tr>
            <!-- th: judul kolom -->
            <th>Data</th>
            <th>Isi</th>
        </tr>
        <tr>
            <!-- td: isi data tabel -->
            <td>Nama</td>
            <td>Jundi Hd</td>
        </tr>
        <tr>
            <td>Umur</td>
            <td>21 Tahun</td>
        </tr>
        <tr>
            <td>Email</td>
            <td>jundi@example.com</td>
        </tr>
    </table>

    <!-- A: membuat link ke media sosial -->
    <h2>Media Sosial</h2>
    <table>
        <tr>
            <td>Info lebih lanjut tentang saya: </td>
        </tr>
        <tr>
            <td><a href="https://instagram.com" target="_blank">Instagram</a></td>
        </tr>
        <tr>
            <td><a href="https://github.com/Jundihd/belajar" target="_blank">Github</a></td>
    </table>

    <!-- Form: membuat formulir sederhana untuk mengirim pesan -->
    <h2>Kirim Pesan</h2>
    <form>
        <!-- Input: kolom isian teks -->
        <label>Nama:</label><br>
        <input type="text" name="nama"><br><br>

        <label>Email:</label><br>
        <input type="email" name="email"><br><br>

        <!-- Textarea: area untuk menulis pesan -->
        <label>Pesan:</label><br>
        <textarea name="pesan"></textarea><br><br>

        <!-- Button: tombol kirim -->
        <button type="submit">Kirim</button>
    </form>

</body>
</html>
